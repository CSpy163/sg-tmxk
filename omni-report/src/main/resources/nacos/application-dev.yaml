spring:
  application:
    name: omni-report
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_HOST:127.0.0.1}:${NACOS_SERVER_PORT:8848}
server:
  port: 9998

dubbo:
  registry:
    address: nacos://${NACOS_SERVER_HOST:127.0.0.1}:${NACOS_SERVER_PORT:8848}
    register-mode: instance
  protocol:
    name: tri
    port: -1
  application:
    name: ${spring.application.name}
    logger: slf4j