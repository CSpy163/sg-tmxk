spring:
  application:
    name: tmxk-service
  redis:
    redisson:
      config: |
        singleServerConfig:
          address: "redis://${REDIS_SERVER_HOST:127.0.0.1}:${REDIS_SERVER_PORT:6379}"
          timeout: 3000
          connectionPoolSize: 64
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite:${DB_FILE}
    username:
    password:
    hikari:
      maximum-pool-size: 1
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_HOST:127.0.0.1}:${NACOS_SERVER_PORT:8848}
server:
  port: 9999

# application.yml
dubbo:
  registry:
    address: nacos://${NACOS_SERVER_HOST:127.0.0.1}:${NACOS_SERVER_PORT:8848}
    # This will enable application-level service discovery only (the recommended service discovery method for Dubbo3).
    # For users upgrading from Dubbo2.x, please set the value to 'all' for smooth migration.
    register-mode: instance
  protocol:
    name: tri
    port: -1
  application:
    name: ${spring.application.name}
    logger: slf4j

tmxk:
  wechat:
    token: ${WECHAT_TOKEN}
    aes-key: ${WECHAT_AES_KEY}
    app-id: ${WECHAT_APP_ID}
    app-key: ${WECHAT_APP_KEY}